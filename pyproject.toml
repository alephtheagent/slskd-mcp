[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slskd-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for the slskd Soulseek daemon"
readme = "README.md"
authors = [
    { name = "Aleph the Agent", email = "ilya2accpidor@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
slskd-mcp = "slskd_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
